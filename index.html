<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>PacCraft</title>
<meta name="description" content="PacCraft — a blocky maze-chase adventure: gobble gems, dig through walls, build blocks, and bonk cube monsters with Power Crystals.">
<meta name="theme-color" content="#1a1420">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PacCraft">
<link rel="stylesheet" href="src/style.css">
</head>
<body>
<!-- BEGIN APP -->
<div id="app">

  <!-- ================= TITLE ================= -->
  <section id="screen-title" class="screen active">
    <div class="title-wrap">
      <canvas id="logo" class="logo" aria-label="PacCraft"></canvas>
      <div class="tagline">Gobble gems · Dig tunnels · Bonk monsters!</div>
      <canvas id="title-scene" class="title-scene"></canvas>
      <div class="hello" id="hello">Hi, Max!</div>
      <div class="menu">
        <button class="btn btn-green btn-xl" id="btn-play"><span class="ico" data-ico="play"></span>PLAY</button>
        <div class="menu-row">
          <button class="btn" id="btn-craft"><span class="ico" data-ico="craft"></span>Craft</button>
          <button class="btn" id="btn-hero"><span class="ico" data-ico="hero"></span>Hero</button>
        </div>
        <div class="menu-row">
          <button class="btn" id="btn-build"><span class="ico" data-ico="build"></span>Build</button>
          <button class="btn" id="btn-help"><span class="ico" data-ico="help"></span>How</button>
        </div>
      </div>
      <div class="title-stats" id="title-stats"></div>
      <button class="corner-btn" id="btn-settings" aria-label="Settings"><span class="ico" data-ico="gear"></span></button>
    </div>
  </section>

  <!-- ================= PLAY (level select) ================= -->
  <section id="screen-play" class="screen">
    <header class="bar"><button class="btn btn-sm back" data-back>◀</button><h2>Pick a Level</h2><span></span></header>
    <div class="scroll">
      <div class="panel">
        <div class="label">Difficulty</div>
        <div class="seg" id="diff-seg">
          <button data-diff="easy">Easy</button><button data-diff="normal">Normal</button><button data-diff="hard">Hard</button>
        </div>
        <div class="hint" id="diff-desc"></div>
      </div>
      <div class="tabs" id="play-tabs"><button data-tab="adventure" class="active">Adventure</button><button data-tab="mine">My Levels</button></div>
      <div id="tab-adventure" class="level-grid"></div>
      <div id="tab-mine" class="mylevels" hidden></div>
    </div>
  </section>

  <!-- ================= GAME ================= -->
  <section id="screen-game" class="screen game">
    <div class="hud">
      <div class="hud-row">
        <button class="hud-btn" id="btn-pause" aria-label="Pause"><span class="ico" data-ico="pause"></span></button>
        <div class="hearts" id="hud-hearts"></div>
        <div class="armor" id="hud-armor"></div>
        <div class="score" id="hud-score">0</div>
        <div class="lvl" id="hud-level">LV 1</div>
      </div>
      <div class="hud-row small">
        <div class="chip"><span class="gem-dot"></span><b id="hud-gems">0</b></div>
        <div class="chip" id="hud-ores"></div>
        <div class="power" id="hud-power" hidden><div class="power-fill" id="hud-power-fill"></div></div>
        <div class="biome" id="hud-biome"></div>
      </div>
    </div>
    <div class="stage" id="stage"><canvas id="board"></canvas></div>
    <div class="controls" id="controls">
      <div class="dpad" id="dpad" aria-label="Move">
        <div class="dpad-ring"></div>
        <div class="dpad-arrow up">▲</div><div class="dpad-arrow left">◀</div><div class="dpad-arrow down">▼</div><div class="dpad-arrow right">▶</div>
        <div class="dpad-knob" id="dpad-knob"></div>
      </div>
      <div class="actions">
        <button class="act act-mine" id="act-mine"><img alt=""><span>DIG</span></button>
        <div class="act-col">
          <button class="act act-block" id="act-block"><img alt=""><span class="cnt" id="cnt-block">0</span></button>
          <button class="act act-tnt" id="act-tnt"><img alt=""><span class="cnt" id="cnt-tnt">0</span></button>
        </div>
      </div>
    </div>

    <div class="overlay" id="ov-pause" hidden>
      <div class="card">
        <h2>Paused</h2>
        <button class="btn btn-green btn-lg" id="btn-resume">Keep Playing</button>
        <button class="btn" id="btn-restart">Restart Level</button>
        <div class="menu-row"><button class="btn btn-sm" id="pause-sfx">Sound</button><button class="btn btn-sm" id="pause-music">Music</button></div>
        <button class="btn btn-red" id="btn-quit">Quit to Menu</button>
      </div>
    </div>
    <div class="overlay" id="ov-clear" hidden>
      <div class="card">
        <h2 class="win">Level Clear!</h2>
        <div class="stats" id="clear-stats"></div>
        <button class="btn btn-green btn-lg" id="btn-next">Next Level ▶</button>
        <button class="btn" id="btn-clear-craft"><span class="ico" data-ico="craft"></span>Crafting Table</button>
        <button class="btn btn-sm" id="btn-clear-menu">Menu</button>
      </div>
    </div>
    <div class="overlay" id="ov-over" hidden>
      <div class="card">
        <h2 class="lose">Game Over</h2>
        <div class="stats" id="over-stats"></div>
        <button class="btn btn-green btn-lg" id="btn-retry">Try Again</button>
        <button class="btn" id="btn-over-craft"><span class="ico" data-ico="craft"></span>Crafting Table</button>
        <button class="btn btn-sm" id="btn-over-menu">Menu</button>
      </div>
    </div>
  </section>

  <!-- ================= CRAFTING TABLE ================= -->
  <section id="screen-craft" class="screen">
    <header class="bar"><button class="btn btn-sm back" data-back>◀</button><h2>Crafting Table</h2><span></span></header>
    <div class="ore-bank" id="ore-bank"></div>
    <div class="scroll"><div class="recipes" id="recipes"></div></div>
    <div class="craft-foot" id="craft-foot" hidden><button class="btn btn-green btn-lg" id="btn-craft-continue">Continue ▶</button></div>
  </section>

  <!-- ================= HERO ================= -->
  <section id="screen-hero" class="screen">
    <header class="bar"><button class="btn btn-sm back" data-back>◀</button><h2>Your Hero</h2><span></span></header>
    <div class="scroll">
      <canvas id="hero-preview" class="hero-preview"></canvas>
      <div class="panel">
        <div class="label">Name</div>
        <input id="hero-name" class="text-in" maxlength="12" autocomplete="off" spellcheck="false">
      </div>
      <div class="panel"><div class="label">Hat</div><div class="swatches" id="sw-hat"></div></div>
      <div class="panel"><div class="label">Pet</div><div class="swatches" id="sw-pet"></div></div>
      <div class="panel"><div class="label">Shirt</div><div class="swatches" id="sw-shirt"></div></div>
      <div class="panel"><div class="label">Pants</div><div class="swatches" id="sw-pants"></div></div>
      <div class="panel"><div class="label">Hair</div><div class="swatches" id="sw-hair"></div></div>
      <div class="panel"><div class="label">Skin</div><div class="swatches" id="sw-skin"></div></div>
    </div>
  </section>

  <!-- ================= BUILDER ================= -->
  <section id="screen-builder" class="screen builder">
    <header class="bar"><button class="btn btn-sm back" id="bld-back">◀</button><input id="bld-name" class="text-in name-in" maxlength="18" spellcheck="false"><button class="btn btn-sm btn-green" id="bld-test">▶ Test</button></header>
    <div class="bld-tools">
      <div class="seg small" id="bld-biome"></div>
    </div>
    <div class="bld-stage" id="bld-stage"><canvas id="bld-canvas"></canvas></div>
    <div class="bld-row">
      <button class="btn btn-sm tog" id="bld-mirror">Mirror</button>
      <button class="btn btn-sm tog" id="bld-tunnel">Tunnel</button>
      <button class="btn btn-sm" id="bld-random">Random</button>
      <button class="btn btn-sm" id="bld-clear">Clear</button>
      <button class="btn btn-sm btn-green" id="bld-save">Save</button>
    </div>
    <div class="palette" id="bld-palette"></div>
    <div class="bld-msg" id="bld-msg"></div>
  </section>

  <!-- ================= SETTINGS ================= -->
  <section id="screen-settings" class="screen">
    <header class="bar"><button class="btn btn-sm back" data-back>◀</button><h2>Settings</h2><span></span></header>
    <div class="scroll">
      <div class="panel settings" id="settings-list"></div>
      <div class="panel">
        <button class="btn btn-red" id="btn-reset">Reset All Progress</button>
        <div class="hint">PacCraft v<span id="ver"></span> · made for Max</div>
      </div>
    </div>
  </section>

  <!-- ================= HELP ================= -->
  <section id="screen-help" class="screen">
    <header class="bar"><button class="btn btn-sm back" data-back>◀</button><h2>How to Play</h2><span></span></header>
    <div class="scroll"><div class="help" id="help-list"></div></div>
  </section>

  <!-- modal -->
  <div class="modal" id="modal" hidden>
    <div class="card"><h2 id="modal-title"></h2><p id="modal-text"></p><div class="menu-row" id="modal-btns"></div></div>
  </div>
  <div class="toast" id="toast" hidden></div>
</div>
<!-- END APP -->
<script src="src/world.js"></script>
<script src="src/game.js"></script>
<script src="src/textures.js"></script>
<script src="src/audio.js"></script>
<script src="src/render.js"></script>
<script src="src/builder.js"></script>
<script src="src/app.js"></script>
</body>
</html>
