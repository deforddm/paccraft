:root {
  --bg: #1a1420; --bg2: #241c2c; --panel: rgba(20, 14, 26, 0.82); --line: #0c080f;
  --text: #fbf7ff; --muted: #b9adc6; --green: #4fa132; --green-d: #2f6b1f; --red: #c83a31; --red-d: #7d1f19;
  --gold: #f7c936; --stone: #8b8b8f; --stone-l: #b3b3b8; --stone-d: #5a5a60;
  --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px);
  --head: 'Bungee', 'Arial Black', Impact, system-ui, sans-serif;
  --body: 'Rubik', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--body); overflow: hidden; overscroll-behavior: none; }
body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: manipulation; }
button { font: inherit; color: inherit; cursor: pointer; }
[hidden] { display: none !important; }

#app { position: fixed; inset: 0; background-color: var(--bg); background-image: var(--bgtex, none); background-size: 64px 64px; image-rendering: pixelated; }
#app::before { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 35%, rgba(26, 20, 32, 0.62), rgba(12, 8, 16, 0.92) 75%); pointer-events: none; }
.screen { position: absolute; inset: 0; display: none; flex-direction: column; padding: calc(var(--safe-t) + 8px) 12px calc(var(--safe-b) + 8px); image-rendering: auto; }
.screen.active { display: flex; }
.scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 4px 2px 20px; display: flex; flex-direction: column; gap: 12px; }

/* ---------- buttons ---------- */
.btn {
  position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 52px; padding: 8px 18px; border: 3px solid var(--line); border-radius: 4px;
  background: linear-gradient(#a3a3a8, #85858a); color: #fff; font-family: var(--head); font-size: 18px; letter-spacing: 0.5px;
  text-shadow: 2px 2px 0 #3a3a40; box-shadow: inset 3px 3px 0 var(--stone-l), inset -3px -4px 0 var(--stone-d);
  transition: transform 0.06s;
}
.btn:active, .btn.pressed { transform: translateY(2px); box-shadow: inset 3px 3px 0 var(--stone-d), inset -3px -3px 0 var(--stone-l); }
.btn:disabled { filter: grayscale(0.8) brightness(0.7); cursor: default; }
.btn-green { background: linear-gradient(#63b843, #479a2c); box-shadow: inset 3px 3px 0 #8fdc6a, inset -3px -4px 0 var(--green-d); text-shadow: 2px 2px 0 #24521a; }
.btn-red { background: linear-gradient(#d9483e, #b3322a); box-shadow: inset 3px 3px 0 #ff8a7f, inset -3px -4px 0 var(--red-d); text-shadow: 2px 2px 0 #5a140f; }
.btn-gold { background: linear-gradient(#fbd54c, #e0b020); box-shadow: inset 3px 3px 0 #fff0a0, inset -3px -4px 0 #9c7410; text-shadow: 2px 2px 0 #7a5a08; }
.btn-xl { min-height: 76px; font-size: 32px; padding: 10px 28px; }
.btn-lg { min-height: 62px; font-size: 22px; }
.btn-sm { min-height: 42px; font-size: 14px; padding: 6px 12px; }
.btn.tog.on { background: linear-gradient(#63b843, #479a2c); box-shadow: inset 3px 3px 0 #8fdc6a, inset -3px -4px 0 var(--green-d); }
.ico { display: inline-block; width: 28px; height: 28px; background-size: contain; background-repeat: no-repeat; background-position: center; image-rendering: pixelated; flex: none; }
.btn-xl .ico { width: 40px; height: 40px; }
.btn-sm .ico { width: 22px; height: 22px; }

/* ---------- title ---------- */
.title-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; max-width: 480px; width: 100%; margin: 0 auto; position: relative; }
.logo { width: min(94vw, 460px); image-rendering: pixelated; }
.tagline { font-family: var(--head); font-size: clamp(12px, 3.6vw, 16px); color: var(--gold); text-shadow: 2px 2px 0 #000; text-align: center; }
.title-scene { width: min(94vw, 460px); height: auto; aspect-ratio: 230 / 42; image-rendering: pixelated; }
.hello { font-family: var(--head); font-size: 20px; text-shadow: 2px 2px 0 #000; }
.menu { display: flex; flex-direction: column; gap: 10px; width: min(88vw, 380px); }
.menu-row { display: flex; gap: 10px; }
.menu-row > .btn { flex: 1; }
.title-stats { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; font-weight: 700; color: var(--muted); font-size: 14px; }
.title-stats .st { display: inline-flex; align-items: center; gap: 5px; }
.title-stats img { width: 20px; height: 20px; image-rendering: pixelated; }
.corner-btn { position: absolute; top: 0; right: 0; width: 48px; height: 48px; border: 3px solid var(--line); border-radius: 4px; background: linear-gradient(#a3a3a8, #85858a); box-shadow: inset 3px 3px 0 var(--stone-l), inset -3px -4px 0 var(--stone-d); display: grid; place-items: center; }

/* ---------- bars, panels, segmented ---------- */
.bar { display: grid; grid-template-columns: 56px 1fr 56px; align-items: center; gap: 8px; margin-bottom: 8px; }
.bar h2 { margin: 0; text-align: center; font-family: var(--head); font-weight: 400; font-size: clamp(18px, 5.5vw, 26px); text-shadow: 2px 2px 0 #000; }
.bar .back { width: 56px; padding: 0; }
.panel { background: var(--panel); border: 3px solid var(--line); border-radius: 6px; padding: 12px; display: flex; flex-direction: column; gap: 10px; box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.05); }
.label { font-family: var(--head); font-size: 14px; color: var(--muted); letter-spacing: 0.5px; }
.hint { color: var(--muted); font-size: 14px; line-height: 1.35; }
.seg { display: flex; border: 3px solid var(--line); border-radius: 4px; overflow: hidden; }
.seg button { flex: 1; min-height: 46px; border: 0; background: #4a4450; font-family: var(--head); font-size: 15px; color: #d8d0e0; border-right: 3px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button.active { background: linear-gradient(#63b843, #479a2c); color: #fff; text-shadow: 2px 2px 0 #24521a; }
.seg.small { overflow-x: auto; scrollbar-width: none; }
.seg.small::-webkit-scrollbar { display: none; }
.seg.small button { flex: 1 0 auto; min-height: 38px; font-size: 11px; padding: 0 7px; }
.tabs { display: flex; gap: 8px; }
.tabs button { flex: 1; min-height: 44px; border: 3px solid var(--line); border-radius: 4px 4px 0 0; background: #3a3440; font-family: var(--head); font-size: 15px; color: #cfc6d8; }
.tabs button.active { background: #5c5466; color: #fff; }

/* ---------- level grid ---------- */
.level-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; }
.lvl-btn { position: relative; aspect-ratio: 1; border: 3px solid var(--line); border-radius: 6px; background-size: cover; image-rendering: pixelated; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding: 6px; font-family: var(--head); color: #fff; text-shadow: 2px 2px 0 #000; box-shadow: inset 0 -40px 30px -20px rgba(0, 0, 0, 0.7); }
.lvl-btn .n { font-size: 30px; line-height: 1; }
.lvl-btn .b { font-family: var(--body); font-weight: 700; font-size: 11px; opacity: 0.95; }
.lvl-btn.locked { filter: grayscale(1) brightness(0.45); }
.lvl-btn.next { outline: 3px solid var(--gold); outline-offset: 2px; animation: pulse 1.2s infinite; }
@keyframes pulse { 50% { outline-color: #fff; } }
.mylevels { display: flex; flex-direction: column; gap: 10px; }
.my-card { display: grid; grid-template-columns: 76px 1fr; gap: 10px; align-items: center; background: var(--panel); border: 3px solid var(--line); border-radius: 6px; padding: 8px; }
.my-card canvas { width: 76px; height: 92px; image-rendering: pixelated; border: 2px solid var(--line); }
.my-card .nm { font-family: var(--head); font-size: 16px; margin-bottom: 6px; word-break: break-word; }
.my-card .row { display: flex; gap: 6px; flex-wrap: wrap; }
.empty { text-align: center; color: var(--muted); padding: 24px 8px; line-height: 1.5; }

/* ---------- game ---------- */
.screen.game { padding: calc(var(--safe-t) + 4px) 6px calc(var(--safe-b) + 6px); gap: 4px; }
.hud { display: flex; flex-direction: column; gap: 3px; }
.hud-row { display: flex; align-items: center; gap: 8px; min-height: 40px; }
.hud-row.small { min-height: 26px; font-size: 14px; }
.hud-btn { width: 42px; height: 40px; border: 3px solid var(--line); border-radius: 4px; background: linear-gradient(#a3a3a8, #85858a); box-shadow: inset 2px 2px 0 var(--stone-l), inset -2px -3px 0 var(--stone-d); display: grid; place-items: center; padding: 0; }
.hearts { display: flex; gap: 2px; flex-wrap: wrap; max-width: 40%; }
.hearts img { width: 22px; height: 20px; image-rendering: pixelated; }
.hearts img.pop { animation: heartpop 0.4s; }
.armor { display: flex; gap: 2px; }
.armor img { width: 18px; height: 18px; image-rendering: pixelated; filter: drop-shadow(0 0 3px rgba(255, 138, 31, 0.8)); }
.armor img.off { filter: grayscale(1) brightness(0.45); }
@keyframes heartpop { 50% { transform: scale(1.5); } }
.score { flex: 1; text-align: center; font-family: var(--head); font-size: clamp(18px, 6vw, 26px); text-shadow: 2px 2px 0 #000; }
.lvl { font-family: var(--head); font-size: 14px; background: var(--panel); border: 2px solid var(--line); border-radius: 4px; padding: 4px 8px; white-space: nowrap; }
.chip { display: inline-flex; align-items: center; gap: 5px; font-weight: 700; white-space: nowrap; }
.chip img { width: 18px; height: 18px; image-rendering: pixelated; }
.chip .oc { display: inline-flex; align-items: center; gap: 2px; margin-right: 4px; }
.gem-dot { width: 12px; height: 12px; background: #5ef0a8; border: 2px solid #1d6b4a; transform: rotate(45deg); }
.biome { margin-left: auto; color: var(--muted); font-weight: 700; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.power { flex: 1; max-width: 120px; height: 12px; border: 2px solid var(--line); background: #2a1a3a; border-radius: 3px; overflow: hidden; }
.power-fill { height: 100%; background: linear-gradient(90deg, #e36bff, #ffd23d); width: 100%; }
.stage { flex: 1; min-height: 0; display: grid; place-items: center; position: relative; touch-action: none; }
#board { image-rendering: pixelated; border: 3px solid var(--line); border-radius: 4px; box-shadow: 0 6px 24px rgba(0, 0, 0, 0.6); background: #111; }

.controls { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 2px 8px 0; height: clamp(136px, 24vh, 210px); touch-action: none; }
.controls.lefty { flex-direction: row-reverse; }
.controls.nodpad .dpad { visibility: hidden; }
.dpad { position: relative; height: 100%; aspect-ratio: 1; max-width: 48vw; touch-action: none; }
.dpad-ring { position: absolute; inset: 4%; border-radius: 50%; background: radial-gradient(circle, #4a4450 0 30%, #3a3440 31% 100%); border: 4px solid var(--line); box-shadow: inset 0 4px 0 rgba(255, 255, 255, 0.12), inset 0 -6px 0 rgba(0, 0, 0, 0.35); }
.dpad-arrow { position: absolute; font-size: clamp(16px, 5vw, 24px); color: #d8d0e0; text-shadow: 2px 2px 0 #000; transform: translate(-50%, -50%); pointer-events: none; }
.dpad-arrow.up { left: 50%; top: 17%; } .dpad-arrow.down { left: 50%; top: 83%; } .dpad-arrow.left { left: 17%; top: 50%; } .dpad-arrow.right { left: 83%; top: 50%; }
.dpad-arrow.lit { color: var(--gold); }
.dpad-knob { position: absolute; left: 50%; top: 50%; width: 36%; height: 36%; transform: translate(-50%, -50%); border-radius: 50%; background: linear-gradient(#a3a3a8, #7a7a80); border: 4px solid var(--line); box-shadow: inset 3px 3px 0 var(--stone-l), inset -3px -4px 0 var(--stone-d); pointer-events: none; }
.actions { height: 100%; display: flex; align-items: center; gap: 10px; }
.act-col { display: flex; flex-direction: column; gap: 10px; height: 100%; justify-content: center; }
.act { position: relative; border: 4px solid var(--line); border-radius: 50%; display: grid; place-items: center; padding: 0; touch-action: none; box-shadow: inset 4px 4px 0 rgba(255, 255, 255, 0.35), inset -4px -5px 0 rgba(0, 0, 0, 0.35); }
.act:active, .act.pressed { transform: translateY(2px) scale(0.97); }
.act img { width: 58%; height: 58%; image-rendering: pixelated; pointer-events: none; }
.act-mine { width: clamp(84px, 24vw, 120px); height: clamp(84px, 24vw, 120px); background: linear-gradient(#f0b640, #d08a1c); }
.act-mine span { position: absolute; bottom: 8%; font-family: var(--head); font-size: 13px; text-shadow: 2px 2px 0 #6a3a00; pointer-events: none; }
.act-mine img { width: 52%; height: 52%; margin-bottom: 14%; }
.act-block, .act-tnt { width: clamp(58px, 16vw, 78px); height: clamp(58px, 16vw, 78px); }
.act-block { background: linear-gradient(#c49859, #9c7240); }
.act-tnt { background: linear-gradient(#e05a4f, #b3322a); }
.act .cnt { position: absolute; right: -6px; bottom: -6px; min-width: 26px; height: 26px; padding: 0 5px; border-radius: 13px; background: #fff; color: #1a1420; border: 3px solid var(--line); font-family: var(--head); font-size: 13px; display: grid; place-items: center; pointer-events: none; }
.act.empty { filter: grayscale(0.9) brightness(0.65); }

@media (orientation: landscape) and (max-height: 600px) {
  .screen.game { display: none; }
  .screen.game.active { display: grid; grid-template-columns: 1fr auto 1fr; grid-template-rows: auto 1fr; grid-template-areas: 'hud hud hud' 'dp stage act'; gap: 6px; }
  .hud { grid-area: hud; }
  .hud-row.small { display: none; }
  .stage { grid-area: stage; }
  .controls { display: contents; }
  .dpad { grid-area: dp; height: min(46vh, 180px); align-self: center; justify-self: center; }
  .actions { grid-area: act; height: min(52vh, 200px); align-self: center; justify-self: center; }
  .controls.lefty .dpad { grid-area: act; } .controls.lefty .actions { grid-area: dp; }
}

/* ---------- overlays / modal ---------- */
.overlay, .modal { position: absolute; inset: 0; background: rgba(8, 4, 12, 0.72); display: grid; place-items: center; padding: 16px; z-index: 20; }
.modal { z-index: 40; }
.card { width: min(92vw, 380px); background: #2a2230; border: 4px solid var(--line); border-radius: 8px; padding: 18px 16px; display: flex; flex-direction: column; gap: 10px; text-align: center; box-shadow: inset 0 0 0 3px rgba(255, 255, 255, 0.07), 0 10px 40px rgba(0, 0, 0, 0.6); animation: popin 0.22s ease-out; }
@keyframes popin { from { transform: scale(0.85); opacity: 0; } }
.card h2 { margin: 0 0 4px; font-family: var(--head); font-weight: 400; font-size: 28px; text-shadow: 3px 3px 0 #000; }
.card h2.win { color: #7dff8a; } .card h2.lose { color: #ff7a6a; }
.card p { margin: 0 0 6px; color: var(--muted); line-height: 1.4; }
.stats { display: flex; flex-direction: column; gap: 6px; font-weight: 700; font-size: 16px; margin-bottom: 4px; }
.stats .line { display: flex; justify-content: space-between; align-items: center; background: rgba(0, 0, 0, 0.25); padding: 6px 10px; border-radius: 4px; }
.stats .ores { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.stats img { width: 22px; height: 22px; image-rendering: pixelated; vertical-align: middle; }
.stats .best { color: var(--gold); }
.in-game .toast { bottom: auto; top: calc(var(--safe-t) + 96px); background: rgba(42, 34, 48, 0.94); border-color: var(--gold); pointer-events: none; }
.toast { position: absolute; left: 50%; bottom: calc(var(--safe-b) + 24px); transform: translateX(-50%); background: #2a2230; border: 3px solid var(--line); border-radius: 6px; padding: 10px 16px; font-weight: 700; z-index: 50; animation: popin 0.2s; max-width: 90vw; text-align: center; }

/* ---------- crafting ---------- */
.ore-bank { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; background: var(--panel); border: 3px solid var(--line); border-radius: 6px; padding: 8px; font-family: var(--head); font-size: 18px; margin-bottom: 8px; }
.ore-bank span { display: inline-flex; align-items: center; gap: 5px; }
.ore-bank img { width: 26px; height: 26px; image-rendering: pixelated; }
.recipes { display: flex; flex-direction: column; gap: 10px; }
.recipe { display: grid; grid-template-columns: 58px 1fr; gap: 10px; background: var(--panel); border: 3px solid var(--line); border-radius: 6px; padding: 10px; align-items: center; }
.recipe.flash { animation: craftflash 0.5s; }
@keyframes craftflash { 30% { background: #4a6a2a; } }
.recipe .ric { width: 58px; height: 58px; background: #3a3440; border: 3px solid var(--line); border-radius: 4px; display: grid; place-items: center; }
.recipe .ric img { width: 42px; height: 42px; image-rendering: pixelated; }
.recipe .rn { font-family: var(--head); font-size: 16px; }
.recipe .rd { color: var(--muted); font-size: 13px; line-height: 1.3; margin: 2px 0 6px; }
.recipe .pips { display: inline-flex; gap: 3px; margin-left: 6px; vertical-align: middle; }
.recipe .pip { width: 10px; height: 10px; border: 2px solid var(--line); background: #3a3440; }
.recipe .pip.on { background: var(--gold); }
.recipe .rbot { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.cost { display: inline-flex; gap: 8px; font-weight: 900; }
.cost span { display: inline-flex; align-items: center; gap: 3px; }
.cost span.short { color: #ff7a6a; }
.cost img { width: 20px; height: 20px; image-rendering: pixelated; }
.craft-foot { padding-top: 8px; display: flex; }
.craft-foot .btn { flex: 1; }

/* ---------- hero ---------- */
.hero-preview { width: 160px; height: 160px; margin: 0 auto; image-rendering: pixelated; background: radial-gradient(circle, #3a3440, transparent 70%); flex: none; }
.text-in { width: 100%; min-height: 48px; font: 700 20px var(--body); color: #fff; background: #151018; border: 3px solid var(--line); border-radius: 4px; padding: 6px 10px; user-select: text; -webkit-user-select: text; }
.swatches { display: flex; flex-wrap: wrap; gap: 8px; }
.sw { width: 48px; height: 48px; border: 3px solid var(--line); border-radius: 6px; padding: 0; position: relative; background-size: 80%; background-repeat: no-repeat; background-position: center; image-rendering: pixelated; }
.sw.active { outline: 3px solid var(--gold); outline-offset: 2px; }
.sw .lock { position: absolute; inset: 0; background: rgba(0, 0, 0, 0.55); display: grid; place-items: center; font-size: 10px; font-weight: 900; line-height: 1.1; border-radius: 3px; }
.sw .lock img { width: 14px; height: 14px; image-rendering: pixelated; }

/* ---------- builder ---------- */
.screen.builder { gap: 6px; }
.builder .bar { grid-template-columns: 56px 1fr auto; margin-bottom: 0; }
.name-in { min-height: 42px; font-size: 16px; }
.bld-stage { flex: 1; min-height: 0; display: grid; place-items: center; touch-action: none; }
#bld-canvas { image-rendering: pixelated; border: 3px solid var(--line); background: #111; touch-action: none; }
.bld-row { display: flex; gap: 6px; }
.bld-row .btn { flex: 1; padding: 4px 6px; font-size: 12px; }
.palette { display: flex; gap: 6px; overflow-x: auto; padding: 4px 2px 6px; -webkit-overflow-scrolling: touch; }
.pal { flex: none; width: 56px; height: 60px; border: 3px solid var(--line); border-radius: 6px; background: #3a3440; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2px; font-size: 9px; font-weight: 700; color: #d8d0e0; }
.pal img { width: 36px; height: 36px; image-rendering: pixelated; }
.pal.active { background: #6a5a2a; outline: 3px solid var(--gold); outline-offset: -1px; }
.bld-msg { min-height: 18px; font-size: 13px; color: var(--muted); text-align: center; }

/* ---------- settings & help ---------- */
.settings .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 52px; border-bottom: 2px solid rgba(255, 255, 255, 0.06); }
.settings .row:last-child { border-bottom: 0; }
.settings .row .t { font-weight: 700; font-size: 16px; }
.settings .row .d { color: var(--muted); font-size: 12px; }
.switch { width: 64px; height: 36px; border: 3px solid var(--line); border-radius: 18px; background: #4a4450; position: relative; flex: none; padding: 0; }
.switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #d8d0e0; transition: left 0.15s; }
.switch.on { background: var(--green); }
.switch.on::after { left: 31px; background: #fff; }
.help { display: flex; flex-direction: column; gap: 10px; }
.help .h { display: grid; grid-template-columns: 64px 1fr; gap: 12px; align-items: center; background: var(--panel); border: 3px solid var(--line); border-radius: 6px; padding: 10px; }
.help .h canvas, .help .h img { width: 64px; height: 64px; image-rendering: pixelated; }
.help .h b { font-family: var(--head); font-weight: 400; font-size: 16px; display: block; margin-bottom: 3px; }
.help .h span { color: var(--muted); font-size: 14px; line-height: 1.35; }

/* ---------- update-ready bar ---------- */
.update-bar { position: absolute; left: 50%; bottom: calc(var(--safe-b) + 14px); transform: translateX(-50%); z-index: 45; width: min(94vw, 420px); display: grid; grid-template-columns: 36px 1fr auto 32px; align-items: center; gap: 10px; padding: 8px 8px 8px 12px; background: #2a2230; border: 3px solid var(--gold); border-radius: 8px; box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6), inset 0 0 0 2px rgba(255, 255, 255, 0.06); animation: popin 0.25s ease-out; }
.update-bar img { width: 30px; height: 35px; image-rendering: pixelated; animation: updbob 1.2s ease-in-out infinite; }
@keyframes updbob { 50% { transform: translateY(-3px); } }
.update-bar span { display: flex; flex-direction: column; line-height: 1.2; min-width: 0; }
.update-bar b { font-family: var(--head); font-weight: 400; font-size: 16px; color: var(--gold); text-shadow: 2px 2px 0 #000; }
.update-bar small { color: var(--muted); font-size: 12px; font-weight: 700; }
.update-bar .upd-x { width: 32px; height: 32px; border: 0; border-radius: 4px; background: transparent; color: var(--muted); font-size: 16px; padding: 0; }
.in-game .update-bar { display: none; }
@media (prefers-reduced-motion: reduce) { .update-bar img { animation: none; } }

</style>
</head>
<body>
<div id="app">

  <!-- ================= TITLE ================= -->
  <section id="screen-title" class="screen active">
    <div class="title-wrap">
      <canvas id="logo" class="logo" aria-label="PacCraft"></canvas>
      <div class="tagline">Gobble gems · Dig tunnels · Bonk monsters!</div>
      <canvas id="title-scene" class="title-scene"></canvas>
      <div class="hello" id="hello">Hi, Max!</div>
      <div class="menu">
        <button class="btn btn-green btn-xl" id="btn-play"><span class="ico" data-ico="play"></span>PLAY</button>
        <div class="menu-row">
          <button class="btn" id="btn-craft"><span class="ico" data-ico="craft"></span>Craft</button>
          <button class="btn" id="btn-hero"><span class="ico" data-ico="hero"></span>Hero</button>
        </div>
        <div class="menu-row">
          <button class="btn" id="btn-build"><span class="ico" data-ico="build"></span>Build</button>
          <button class="btn" id="btn-help"><span class="ico" data-ico="help"></span>How</button>
        </div>
      </div>
      <div class="title-stats" id="title-stats"></div>
      <button class="corner-btn" id="btn-settings" aria-label="Settings"><span class="ico" data-ico="gear"></span></button>
    </div>
  </section>

  <!-- ================= PLAY (level select) ================= -->
  <section id="screen-play" class="screen">
    <header class="bar"><button class="btn btn-sm back" data-back>◀</button><h2>Pick a Level</h2><span></span></header>
    <div class="scroll">
      <div class="panel">
        <div class="label">Difficulty</div>
        <div class="seg" id="diff-seg">
          <button data-diff="easy">Easy</button><button data-diff="normal">Normal</button><button data-diff="hard">Hard</button>
        </div>
        <div class="hint" id="diff-desc"></div>
      </div>
      <div class="tabs" id="play-tabs"><button data-tab="adventure" class="active">Adventure</button><button data-tab="mine">My Levels</button></div>
      <div id="tab-adventure" class="level-grid"></div>
      <div id="tab-mine" class="mylevels" hidden></div>
    </div>
  </section>

  <!-- ================= GAME ================= -->
  <section id="screen-game" class="screen game">
    <div class="hud">
      <div class="hud-row">
        <button class="hud-btn" id="btn-pause" aria-label="Pause"><span class="ico" data-ico="pause"></span></button>
        <div class="hearts" id="hud-hearts"></div>
        <div class="armor" id="hud-armor"></div>
        <div class="score" id="hud-score">0</div>
        <div class="lvl" id="hud-level">LV 1</div>
      </div>
      <div class="hud-row small">
        <div class="chip"><span class="gem-dot"></span><b id="hud-gems">0</b></div>
        <div class="chip" id="hud-ores"></div>
        <div class="power" id="hud-power" hidden><div class="power-fill" id="hud-power-fill"></div></div>
        <div class="biome" id="hud-biome"></div>
      </div>
    </div>
    <div class="stage" id="stage"><canvas id="board"></canvas></div>
    <div class="controls" id="controls">
      <div class="dpad" id="dpad" aria-label="Move">
        <div class="dpad-ring"></div>
        <div class="dpad-arrow up">▲</div><div class="dpad-arrow left">◀</div><div class="dpad-arrow down">▼</div><div class="dpad-arrow right">▶</div>
        <div class="dpad-knob" id="dpad-knob"></div>
      </div>
      <div class="actions">
        <button class="act act-mine" id="act-mine"><img alt=""><span>DIG</span></button>
        <div class="act-col">
          <button class="act act-block" id="act-block"><img alt=""><span class="cnt" id="cnt-block">0</span></button>
          <button class="act act-tnt" id="act-tnt"><img alt=""><span class="cnt" id="cnt-tnt">0</span></button>
        </div>
      </div>
    </div>

    <div class="overlay" id="ov-pause" hidden>
      <div class="card">
        <h2>Paused</h2>
        <button class="btn btn-green btn-lg" id="btn-resume">Keep Playing</button>
        <button class="btn" id="btn-restart">Restart Level</button>
        <div class="menu-row"><button class="btn btn-sm" id="pause-sfx">Sound</button><button class="btn btn-sm" id="pause-music">Music</button></div>
        <button class="btn btn-red" id="btn-quit">Quit to Menu</button>
      </div>
    </div>
    <div class="overlay" id="ov-clear" hidden>
      <div class="card">
        <h2 class="win">Level Clear!</h2>
        <div class="stats" id="clear-stats"></div>
        <button class="btn btn-green btn-lg" id="btn-next">Next Level ▶</button>
        <button class="btn" id="btn-clear-craft"><span class="ico" data-ico="craft"></span>Crafting Table</button>
        <button class="btn btn-sm" id="btn-clear-menu">Menu</button>
      </div>
    </div>
    <div class="overlay" id="ov-over" hidden>
      <div class="card">
        <h2 class="lose">Game Over</h2>
        <div class="stats" id="over-stats"></div>

        <button class="btn btn-sm" id="btn-over-menu">Menu</button>
      </div>
    </div>

  <!-- ================= CRAFTING TABLE ================= -->
  <section id="screen-craft" class="screen">

    <div class="ore-bank" id="ore-bank"></div>
    <div class="scroll"><div class="recipes" id="recipes"></div></div>
    <div class="craft-foot" id="craft-foot" hidden><button class="btn btn-green btn-lg" id="btn-craft-continue">Continue ▶</button></div>
  </section>

  <!-- ================= HERO ================= -->
  <section id="screen-hero" class="screen">
    <header class="bar"><button class="btn btn-sm back" data-back>◀</button><h2>Your Hero</h2><span></span></header>
    <div class="scroll">
      <canvas id="hero-preview" class="hero-preview"></canvas>
      <div class="panel">
        <div class="label">Name</div>
        <input id="hero-name" class="text-in" maxlength="12" autocomplete="off" spellcheck="false">
      </div>
      <div class="panel"><div class="label">Hat</div><div class="swatches" id="sw-hat"></div></div>
      <div class="panel"><div class="label">Shirt</div><div class="swatches" id="sw-shirt"></div></div>
      <div class="panel"><div class="label">Pants</div><div class="swatches" id="sw-pants"></div></div>
      <div class="panel"><div class="label">Hair</div><div class="swatches" id="sw-hair"></div></div>
      <div class="panel"><div class="label">Skin</div><div class="swatches" id="sw-skin"></div></div>
    </div>
  </section>

  <!-- ================= BUILDER ================= -->
  <section id="screen-builder" class="screen builder">
    <header class="bar"><button class="btn btn-sm back" id="bld-back">◀</button><input id="bld-name" class="text-in name-in" maxlength="18" spellcheck="false"><button class="btn btn-sm btn-green" id="bld-test">▶ Test</button></header>
    <div class="bld-tools">
      <div class="seg small" id="bld-biome"></div>
    </div>
    <div class="bld-stage" id="bld-stage"><canvas id="bld-canvas"></canvas></div>
    <div class="bld-row">
      <button class="btn btn-sm tog" id="bld-mirror">Mirror</button>
      <button class="btn btn-sm tog" id="bld-tunnel">Tunnel</button>
      <button class="btn btn-sm" id="bld-random">Random</button>
      <button class="btn btn-sm" id="bld-clear">Clear</button>
      <button class="btn btn-sm btn-green" id="bld-save">Save</button>
    </div>
    <div class="palette" id="bld-palette"></div>
    <div class="bld-msg" id="bld-msg"></div>
  </section>

  <!-- ================= SETTINGS ================= -->
  <section id="screen-settings" class="screen">
    <header class="bar"><button class="btn btn-sm back" data-back>◀</button><h2>Settings</h2><span></span></header>
    <div class="scroll">
      <div class="panel settings" id="settings-list"></div>
      <div class="panel">
        <button class="btn btn-red" id="btn-reset">Reset All Progress</button>
        <div class="hint">PacCraft v<span id="ver"></span> · made for Max</div>
      </div>
    </div>
  </section>

  <!-- ================= HELP ================= -->
  <section id="screen-help" class="screen">
    <header class="bar"><button class="btn btn-sm back" data-back>◀</button><h2>How to Play</h2><span></span></header>
    <div class="scroll"><div class="help" id="help-list"></div></div>
  </section>

  <!-- modal -->
  <div class="modal" id="modal" hidden>
    <div class="card"><h2 id="modal-title"></h2><p id="modal-text"></p><div class="menu-row" id="modal-btns"></div></div>
  </div>
  <div class="toast" id="toast" hidden></div>
</div>

<script>
/* PacCraft — world data: block types, biomes, seeded RNG, maze generator, level builder.
 * Pure logic (no DOM) so it can be tested in Node. */
(function (root) {
  'use strict';

  var W = 19, H = 23;

  // ---------- tiles ----------
  var TILE = {
    FLOOR: 0, BORDER: 1, PEN: 2, DOOR: 3, PLANKS: 4,
    GRASS: 10, DIRT: 11, STONE: 12, COBBLE: 13, LOG: 14, LEAVES: 15, SAND: 16, SANDSTONE: 17,
    SNOW: 18, ICE: 19, MAGMA: 20, BASALT: 21, CRYSTAL: 22, CLAY: 23, MOSS: 24,
    COAL: 30, IRON: 31, GOLD: 32, DIAMOND: 33, EMBER: 34
  };

  // hard = seconds to mine with the starting (wooden) pickaxe. Infinity = can't be mined.
  var BLOCKS = {};
  function def(id, name, hard, drop, pts) { BLOCKS[id] = { id: id, name: name, hard: hard, drop: drop || null, pts: pts || 5 }; }
  def(TILE.BORDER, 'Bedrock', Infinity);
  def(TILE.PEN, 'Spawner Cage', Infinity);

  ];
  function canAfford(cost) { return Object.keys(cost).every(function (k) { return save.ores[k] >= cost[k]; }); }
  function renderCraft() {
    var bank = '';
    ['coal', 'iron', 'gold', 'diamond', 'ember'].forEach(function (k) { bank += '<span>' + img(ICON.ore[k]) + save.ores[k] + '</span>'; });
    $('ore-bank').innerHTML = bank;
    $('craft-foot').hidden = !craftThen;
    var box = $('recipes'); box.innerHTML = '';
    RECIPES.forEach(function (rc) {
      var lv = rc.consumable ? save.tnt : save.up[rc.id];
      var maxed = lv >= rc.max, cost = rc.consumable ? rc.cost[0] : rc.cost[Math.min(lv, rc.cost.length - 1)];
      var name = rc.names[Math.min(lv, rc.names.length - 1)];
      if (maxed && !rc.consumable) name = rc.names[rc.names.length - 1];
      var el = document.createElement('div'); el.className = 'recipe';
      var pips = '';
      if (!rc.consumable) { for (var i = 0; i < rc.max; i++) pips += '<span class="pip' + (i < lv ? ' on' : '') + '"></span>'; }
      else pips = '<span style="font-weight:900;color:var(--gold)">×' + lv + '</span>';
      var cs = '';
      Object.keys(cost).forEach(function (k) { cs += '<span class="' + (save.ores[k] < cost[k] ? 'short' : '') + '">' + img(ICON.ore[k]) + cost[k] + '</span>'; });
      el.innerHTML = '<div class="ric">' + img(rc.icon(lv)) + '</div><div><div class="rn">' + name + '<span class="pips">' + pips + '</span></div><div class="rd">' + rc.desc + '</div>' +
        '<div class="rbot"><span class="cost">' + (maxed ? '<span style="color:var(--gold)">' + (rc.consumable ? 'Bag full!' : 'Maxed out!') + '</span>' : cs) + '</span></div></div>';
      var btn = document.createElement('button');
      btn.className = 'btn btn-sm btn-gold'; btn.textContent = 'Craft';
      btn.disabled = maxed || !canAfford(cost);
      btn.addEventListener('click', function () {
        if (maxed || !canAfford(cost)) return;
        Object.keys(cost).forEach(function (k) { save.ores[k] -= cost[k]; });
        if (rc.consumable) save.tnt++; else save.up[rc.id]++;
        persist(true); A.play('craft'); A.buzz(20);
        toast('Crafted ' + (rc.consumable ? 'TNT' : name) + '!');
        renderCraft();
        var n = box.children[RECIPES.indexOf(rc)]; if (n) n.classList.add('flash');
      });
      el.querySelector('.rbot').appendChild(btn);
      box.appendChild(el);
    });
  }
  $('btn-craft-continue').addEventListener('click', function () { A.play('click'); var f = craftThen; craftThen = null; if (f) f(); });

  // ================= hero =================
  var LOOKS = {
    shirt: ['#e0662f', '#3fa7e0', '#4fb84a', '#d8322b', '#8a5ad6', '#f2c230', '#f28bb8', '#3d3d48', '#ffffff'],
    pants: ['#3b5cc4', '#3d3d48', '#6b4f2c', '#2f8a5a', '#8a3b8a', '#c8c8d0'],
    hair: ['#5a3a22', '#2a1c14', '#d9a441', '#b5552a', '#e8e0d0', '#3a3a3a'],
    skin: ['#f1c49b', '#e0a877', '#c68a5c', '#9c6640', '#6e4428']
  };
  var HAT_COST = { knight: { iron: 6 }, crown: { gold: 6 }, diamond: { diamond: 5 }, ember: { ember: 3 } };
  var heroT = 0;
  function renderHero() {
    $('hero-name').value = save.name || '';
    var hb = $('sw-hat'); hb.innerHTML = '';
    PCTex.HATS.forEach(function (hat) {
      var b = document.createElement('button'); b.className = 'sw' + (save.look.hat === hat ? ' active' : '');
      var lk = Object.assign({}, save.look, { hat: hat, hatColor: save.look.shirt });
      b.style.backgroundImage = 'url(' + PCTex.dataURL(PCTex.hero(lk).down[0], 3) + ')';
      var owned = save.hats.indexOf(hat) >= 0;
      if (!owned) {
        var c = HAT_COST[hat], k = Object.keys(c)[0];
        b.innerHTML = '<span class="lock">' + img(ICON.ore[k]) + c[k] + '</span>';
      }
      b.addEventListener('click', function () {
        if (!owned) {
          var c = HAT_COST[hat], k = Object.keys(c)[0];
          if (save.ores[k] >= c[k]) {
            modal('Unlock this hat?', 'Costs ' + c[k] + ' ' + k + '. You have ' + save.ores[k] + '.', [
              { label: 'Not now', cls: 'btn-sm' },
              { label: 'Unlock!', cls: 'btn-gold btn-sm', fn: function () { save.ores[k] -= c[k]; save.hats.push(hat); save.look.hat = hat; persist(true); A.play('unlock'); lookChanged(); renderHero(); } }]);
          } else { A.play('nope'); toast('Need ' + c[k] + ' ' + k + ' to unlock (you have ' + save.ores[k] + ').'); }
          return;
        }
        A.play('click'); save.look.hat = hat; lookChanged(); renderHero();
      });
      hb.appendChild(b);
    });
    ['shirt', 'pants', 'hair', 'skin'].forEach(function (part) {
      var box = $('sw-' + part); box.innerHTML = '';
      LOOKS[part].forEach(function (col) {
        var b = document.createElement('button'); b.className = 'sw' + (save.look[part] === col ? ' active' : '');
        b.style.background = col;
        b.addEventListener('click', function () { A.play('click'); save.look[part] = col; lookChanged(); renderHero(); });
        box.appendChild(b);
      });
    });
  }
  function lookChanged() { save.look.hatColor = save.look.shirt; renderer.setLook(save.look); persist(); }
  $('hero-name').addEventListener('input', function () { save.name = this.value.trim().slice(0, 12) || 'Max'; persist(); });
  function drawHeroPreview(dt) {
    heroT += dt;
    var c = $('hero-preview'); if (c.width !== 64) { c.width = 64; c.height = 64; }
    var g = c.getContext('2d'); g.imageSmoothingEnabled = false; g.clearRect(0, 0, 64, 64);
    var set = PCTex.hero(save.look), views = ['down', 'right', 'up', 'left'], v = views[Math.floor(heroT / 1.5) % 4];
    var f = 1 + Math.floor(heroT * 5) % 2;
    g.fillStyle = 'rgba(0,0,0,0.3)'; g.beginPath(); g.ellipse(32, 56, 16, 5, 0, 0, 7); g.fill();
    g.drawImage(set[v][f], 8, 6, 48, 48);
    var pk = tex.picks[save.up.pick];
    g.save(); g.translate(v === 'left' ? 14 : 50, 42); if (v === 'left') g.scale(-1, 1); g.rotate(-0.4); g.drawImage(pk, -4, -22, 26, 26); g.restore();
  }

  // ================= builder =================
  var builder = null, editIdx = null;
  function openBuilder(idx) {
    if (!builder) {
      builder = new PCBuilder.Builder($('bld-canvas'));
      builder.onChange = function () { updateBuilderMsg(); };
      var pal = $('bld-palette');
      PCBuilder.TOOLS.forEach(function (t) {
        var b = document.createElement('button'); b.className = 'pal';
        var src = t.id === 'erase' ? ICON.floor.meadow : t.id === 'crystal' ? ICON.crystal : t.id === 'start' ? PCTex.dataURL(PCTex.hero(save.look).down[0], 3) : ICON.cube[t.id];
        b.innerHTML = img(src) + '<span>' + t.name + '</span>';
        b.addEventListener('click', function () { A.play('click'); builder.tool = t.id; pal.querySelectorAll('.pal').forEach(function (x) { x.classList.toggle('active', x === b); }); });
        if (t.id === TILE.STONE) b.classList.add('active');
        pal.appendChild(b);
      });
      var bio = $('bld-biome');
      Wd.BIOMES.forEach(function (bm) {
        var b = document.createElement('button'); b.dataset.biome = bm.id; b.textContent = bm.short;
        b.addEventListener('click', function () { A.play('click'); builder.data.biome = bm.id; syncBiome(); builder.draw(); });
        bio.appendChild(b);
      });
    }
    editIdx = idx;
    var data = idx != null ? save.levels[idx] : { name: (save.name || 'Max') + "'s Level " + (save.levels.length + 1), biome: 'meadow', tiles: null, crystals: [], start: null };
    if (!data.tiles) {
      var seed = Math.floor(Math.random() * 1e9), t = Wd.generateLayout(seed);
      Wd.paintBlocks(t, Wd.biomeById('meadow'), seed, 1);
      data.tiles = Array.prototype.slice.call(t); data.crystals = [[1, 3], [W - 2, 3], [1, H - 4], [W - 2, H - 4]];
    }
    builder.look = save.look;
    builder.load(data);
    $('bld-name').value = builder.data.name;
    $('bld-mirror').classList.toggle('on', builder.mirror);
    syncBiome(); updateBuilderMsg();
    show('builder');
    requestAnimationFrame(layout);
  }
  function syncBiome() { $('bld-biome').querySelectorAll('button').forEach(function (b) { b.classList.toggle('active', b.dataset.biome === builder.data.biome); }); }
  function builderGemCount() { try { return Wd.countGems(Wd.makeCustomLevel(builder.data).gems); } catch (e) { return 0; } }
  function updateBuilderMsg() {
    var n = builderGemCount();
    $('bld-tunnel').classList.toggle('on', builder.tunnelOn());
    $('bld-msg').textContent = n < 10 ? 'Make more open paths — gems go on every path you can reach.' : n + ' gems · tap a block type, then draw! Tap a block again to erase it.';
  }
  function saveBuilder(quiet) {
    builder.data.name = ($('bld-name').value || '').trim() || 'My Level';
    var copy = JSON.parse(JSON.stringify(builder.data));
    if (editIdx != null && save.levels[editIdx]) save.levels[editIdx] = copy; else { save.levels.unshift(copy); editIdx = 0; }
    persist(true);
    if (!quiet) { A.play('craft'); toast('Saved "' + copy.name + '"!'); }
    return copy;
  }
  $('bld-mirror').addEventListener('click', function () { A.play('click'); builder.mirror = !builder.mirror; this.classList.toggle('on', builder.mirror); builder.draw(); });
  $('bld-tunnel').addEventListener('click', function () { A.play('click'); builder.setTunnel(!builder.tunnelOn()); });
  $('bld-random').addEventListener('click', function () { A.play('click'); builder.randomize(); });
  $('bld-clear').addEventListener('click', function () {
    modal('Clear the maze?', 'This removes every block so you can start fresh.', [{ label: 'Cancel', cls: 'btn-sm' }, { label: 'Clear', cls: 'btn-red btn-sm', fn: function () { builder.clearAll(); } }]);
  });
  $('bld-save').addEventListener('click', function () { saveBuilder(false); });
  $('bld-test').addEventListener('click', function () {
    if (builderGemCount() < 10) { A.play('nope'); toast('Needs more open paths first!'); return; }
    A.play('click');
    var copy = saveBuilder(true);
    startCustom(copy, 'builder');
  });
  $('bld-back').addEventListener('click', function () { A.play('click'); saveBuilder(true); show('play', true); document.querySelector('#play-tabs [data-tab="mine"]').click(); });

  // ================= settings =================
  var SETTINGS = [
    { k: 'sfx', t: 'Sound effects' }, { k: 'music', t: 'Music' }, { k: 'haptics', t: 'Vibration', d: 'Buzz on digging and bonks (Android)' },
    { k: 'dpad', t: 'Joystick', d: 'Off = swipe on the maze to move' }, { k: 'lefty', t: 'Left-handed', d: 'Swap joystick and buttons' },
    { k: 'pushDig', t: 'Dig by pushing', d: 'Push into a wall to mine it' }
  ];
  function renderSettings() {
    var box = $('settings-list'); box.innerHTML = '';
    SETTINGS.forEach(function (s) {
      var row = document.createElement('div'); row.className = 'row';
      row.innerHTML = '<div><div class="t">' + s.t + '</div>' + (s.d ? '<div class="d">' + s.d + '</div>' : '') + '</div>';
      var sw = document.createElement('button'); sw.className = 'switch' + (save.settings[s.k] ? ' on' : ''); sw.setAttribute('aria-label', s.t);
      sw.addEventListener('click', function () { save.settings[s.k] = !save.settings[s.k]; applySettings(); persist(); A.play('click'); renderSettings(); });
      row.appendChild(sw); box.appendChild(row);
    });
    $('ver').textContent = VERSION;
  }
  $('btn-reset').addEventListener('click', function () {
    modal('Reset everything?', 'Ores, upgrades, hats, levels you built and high scores will all be erased.', [
      { label: 'Cancel', cls: 'btn-sm' },
      { label: 'Reset', cls: 'btn-red btn-sm', fn: function () { var keep = save.settings; save = defaults(); save.settings = keep; persist(true); renderer.setLook(save.look); toast('Progress reset.'); show('title', true); } }]);
  });

  // ================= help =================
  function renderHelp() {
    var box = $('help-list'); if (box.children.length) return;
    function scene(fn) { var c = PCTex.mk(32, 32), g = c.getContext('2d'); g.imageSmoothingEnabled = false; fn(g); return c; }
    var gemScene = scene(function (g) { g.fillStyle = '#a3845a'; g.fillRect(0, 0, 32, 32); [6, 16, 26].forEach(function (x) { g.fillStyle = '#1d6b4a'; g.fillRect(x - 2, 15, 4, 3); g.fillStyle = '#5ef0a8'; g.fillRect(x - 1.5, 14, 3, 3); }); });
    var items = [
      [gemScene, 'Gobble the gems', 'Eat every green gem to clear the level.'],
      [scene(function (g) { g.drawImage(tex.mons.rumble[0], 0, 8, 16, 16); PCTex.drawEyes(g, 0, 8, 1, 3); g.drawImage(tex.mons.sly[0], 16, 8, 16, 16); PCTex.drawEyes(g, 16, 8, 1, 1); }), 'Watch out!', 'Rumble, Sly, Frost and Mudge chase you. Each one hunts in its own way.'],
      [scene(function (g) { g.drawImage(tex.crystal, 2, 4, 12, 14); g.drawImage(tex.mons.fright[0], 16, 12, 16, 16); PCTex.drawEyes(g, 16, 12, 1, 0, true); }), 'Power Crystals', 'Grab one and the monsters turn blue. Now YOU chase THEM for big points!'],
      [scene(function (g) { g.drawImage(tex.blocks[TILE.STONE].top, 16, 8); g.drawImage(tex.cracks[3], 16, 8); g.drawImage(tex.picks[0], 2, 8, 14, 14); }), 'Dig!', 'Push into a wall or tap DIG to mine it and make a shortcut. The gray edge (bedrock) can\'t be dug.'],
      [scene(function (g) { g.drawImage(tex.blocks[TILE.GOLD].top, 0, 8); g.drawImage(tex.ores.gold, 18, 10, 12, 12); }), 'Find ores', 'Coal, iron, gold and diamond blocks give points and crafting stuff.'],
      [scene(function (g) { g.drawImage(tex.blocks[TILE.EMBER].top, 0, 8); g.drawImage(tex.ores.ember, 18, 10, 12, 12); }), 'Ember Ore',
        'The rarest block of all, hiding deep in the Lava Caves. It\'s tough — bring a Diamond Pickaxe. Trade ember for the Emberite Pickaxe, Emberite Armor and a glowing helmet.'],
      [scene(function (g) { g.drawImage(PCTex.cubeIcon(tex.blocks[TILE.PLANKS], 32), 0, 0); }), 'Build a wall', 'Tap the block button to drop a block behind you. Monsters bump into it! Dig walls to collect more blocks.'],
      [scene(function (g) { g.drawImage(tex.tnt[0], 4, 4, 24, 24); }), 'TNT', 'Drop it and run! It blasts walls and bonks monsters — but never hurts you.'],
      [scene(function (g) { g.drawImage(tex.food.apple, 2, 6, 14, 14); g.drawImage(tex.heart[1], 18, 10); }), 'Snacks', 'Food pops up under the monster cage. Eat it for points and a heart.'],
      [scene(function (g) { var ic = new Image(); ic.src = ICON.craft; g.drawImage(PCTex.cubeIcon(tex.blocks[TILE.PLANKS], 32), 0, 0); }), 'Crafting Table', 'Spend your ores on better pickaxes, speedy boots, extra hearts, TNT and more.'],
      [scene(function (g) { g.drawImage(PCTex.cubeIcon(tex.blocks[TILE.GRASS], 32), 0, 0); }), 'Build your own', 'Make your own maze in Build mode, then play it and show your friends!']
    ];
    items.forEach(function (it) {
      var d = document.createElement('div'); d.className = 'h';
      d.appendChild(it[0]);
      var t = document.createElement('div'); t.innerHTML = '<b>' + it[1] + '</b><span>' + it[2] + '</span>';
      d.appendChild(t); box.appendChild(d);
    });
    var k = document.createElement('div'); k.className = 'hint'; k.style.textAlign = 'center';
    k.textContent = 'Keyboard: arrows/WASD move · Space dig · B block · T TNT · P pause';
    box.appendChild(k);
  }

  // ================= boot =================
  buildIcons();
  applySettings();
  drawLogo();
  enterTitle();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { layout(); });
  requestAnimationFrame(frame);
  // start title music on first touch (browsers need a gesture)
  document.addEventListener('pointerdown', function first() { A.unlock(); if (current === 'title') A.startMusic('title'); document.removeEventListener('pointerdown', first); });

  // ================= updates =================
  // A new version downloads quietly in the background. When it's ready we show a button;
  // tapping it saves progress, switches to the new version and reloads.
  var swReg = null, updateAsked = false, updateReady = false;
  function buildUpdateBar() {
    var bar = document.createElement('div');
    bar.id = 'update-bar'; bar.className = 'update-bar'; bar.hidden = true;
    bar.setAttribute('role', 'status');
    bar.innerHTML = '<img alt="" src="' + ICON.crystal + '"><span><b>Update ready!</b><small>New stuff for PacCraft</small></span>' +
      '<button class="btn btn-sm btn-green" id="btn-update">Update</button><button class="upd-x" id="btn-update-later" aria-label="Later">✕</button>';
    $('app').appendChild(bar);
    $('btn-update').addEventListener('click', applyUpdate);
    $('btn-update-later').addEventListener('click', function () { A.play('click'); bar.hidden = true; updateReady = false; });
  }
  function showUpdateBar() {
    updateReady = true;
    var bar = $('update-bar'); if (!bar) return;
    bar.hidden = false; A.play('foodspawn');
  }
  function applyUpdate() {
    A.play('click');
    persist(true);
    $('btn-update').textContent = 'Updating…'; $('btn-update').disabled = true;
    updateAsked = true;
    if (swReg && swReg.waiting) swReg.waiting.postMessage({ type: 'SKIP_WAITING' });
    else location.reload();
    setTimeout(function () { location.reload(); }, 4000); // safety net
  }
  if (!window.PACCRAFT_SINGLE_FILE && 'serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
    buildUpdateBar();
    navigator.serviceWorker.addEventListener('controllerchange', function () { if (updateAsked) location.reload(); });
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').then(function (reg) {
        swReg = reg;
        var hadController = !!navigator.serviceWorker.controller;
        if (reg.waiting && hadController) showUpdateBar();
        reg.addEventListener('updatefound', function () {
          var w = reg.installing; if (!w) return;
          w.addEventListener('statechange', function () {
            if (w.state === 'installed' && navigator.serviceWorker.controller && reg.waiting) showUpdateBar();
          });
        });
        function check() { reg.update().catch(function () { }); }
        document.addEventListener('visibilitychange', function () { if (!document.hidden) check(); });
        setInterval(check, 20 * 60 * 1000);
      }).catch(function () { });
    });
  }
  window.PacCraft = { updateReady: function () { return updateReady; }, save: function () { return save; }, session: function () { return session; }, show: show, startAdventure: startAdventure, renderer: renderer, VERSION: VERSION };
})();

</script>
</body>
</html>
