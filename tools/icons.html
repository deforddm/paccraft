<script>
// Renders the app icons from the game's own pixel art. Run via tools/make-icons.js (Playwright).
function icon(size, maskable) {
  const tex = PCTex.build(), grid = 64, c = PCTex.mk(grid, grid), g = c.getContext('2d');
  g.imageSmoothingEnabled = false;

  g.fillStyle = '#ffe9a8'; [[8, 8], [52, 6], [44, 16], [14, 20], [58, 26], [30, 4]].forEach(p => g.fillRect(p[0], p[1], 1, 1));

  zg.fillStyle = Y; zg.fillRect(5, 5, 14, 6); zg.fillRect(16, 2, 8, 7); zg.fillStyle = Wt; zg.fillRect(6, 10, 12, 2); zg.fillRect(19, 6, 5, 3);
  zg.fillStyle = B; [[23,6],[21,4],[21,5],[21,6],[7,6],[10,7],[13,6],[9,9],[15,8],[17,0],[21,0],[1,3],[1,4]].forEach(q => zg.fillRect(q[0], q[1], 1, 1)); zg.fillStyle = Y; [[2,5],[3,6],[4,7],[17,1],[21,1]].forEach(q => zg.fillRect(q[0], q[1], 1, 1));

}
